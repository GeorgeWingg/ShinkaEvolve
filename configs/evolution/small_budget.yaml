evo_config:
  _target_: shinka.core.EvolutionConfig
  patch_types:
    - "diff"
    - "full"
  patch_type_probs:
    - 0.8
    - 0.2
  num_generations: 20
  max_parallel_jobs: 1
  max_patch_resamples: 3
  max_patch_attempts: 3
  max_novelty_attempts: 1
  llm_models:
    - "gpt-4.1-mini"
  llm_dynamic_selection: ucb
  llm_kwargs:
    temperatures:
      - 0.0
      - 0.7
    max_tokens: 4096
  meta_rec_interval: 5
  meta_llm_models: null  # Disable Meta-LLM to avoid OpenAI API key conflicts (TODO-002)
  meta_llm_kwargs:
    temperatures:
      - 0.0
  embedding_model: "text-embedding-3-small"
  results_dir: ${output_dir}
  agentic:
    _target_: shinka.core.runner.AgenticConfig
    cli_profile: null
    sandbox: "workspace-write"
    approval_mode: "full-auto"
    max_turns: 30
    max_seconds: 0
    cli_path: null
    extra_cli_config: {}
    resume_parent_session: false
  evaluator:
    _target_: shinka.core.runner.EvaluatorConfig
    mode: auto
    agentic:
      _target_: shinka.core.runner.AgenticEvaluatorConfig
      cli_profile: null
      sandbox: "workspace-write"
      approval_mode: "full-auto"
      max_turns: 50
      max_seconds: 0
      cli_path: null
      extra_cli_config: {}